services:
  mysql:
    image: mysql:8.0
    container_name: secondhand-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: secondhand
      MYSQL_USER: secondhand_user
      MYSQL_PASSWORD: secondhand123
    ports:
      - '3307:3306'
    volumes:
      - secondhand_mysql_data_v2:/var/lib/mysql
      - ./database/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -proot123456 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # migrate service removed to simplify developer flow. Use the provided
  # idempotent SQL in database/mysql/init or run manual SQL against the
  # running container when updating an existing database volume.

volumes:
  secondhand_mysql_data_v2:
